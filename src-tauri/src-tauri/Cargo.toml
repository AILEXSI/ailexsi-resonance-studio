[package]
name = "ailexsi-resonance-studio"
version = "0.3.0"
description = "AILEXSI Resonance Studio — local-first creative desktop"
authors = ["AILEXSI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-save", "dialog-open", "fs-write-file", "fs-read-file", "path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
